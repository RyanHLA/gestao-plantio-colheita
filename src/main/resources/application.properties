spring.application.name=gestao-plantio-colheita
server.port=8080

# API externa de clima (sem chave de acesso)
openmeteo.base-url=https://api.open-meteo.com

# Front Controller: chave exigida no cabeçalho X-API-Key em POST, PUT, PATCH e DELETE.
# Deixe vazio para desligar a autenticação.
gpc.seguranca.api-key=gpc-ifbaiano-2026

# Banco persistente (H2). Os dados são preservados ao reiniciar a aplicação.
spring.datasource.url=jdbc:h2:file:./data/gpc
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
